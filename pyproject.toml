[project]
name = "fastapi-learning"
version = "0.1.0"
description = "Learning FastAPI"
readme = "README.md"
authors = [
    { name = "dharshini610", email = "dharshinisg1006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "con>=1.0.1",
    "fastapi",
    "uv>=0.13.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fastapi-learning = "fastapi_learning:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
